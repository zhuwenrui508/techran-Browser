name: Bug 反馈
description: 报告一个可以复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 感谢反馈！请尽量把信息填完整，方便定位问题。
  - type: input
    id: version
    attributes:
      label: 版本号
      description: 菜单 →「关于」里可以看到
      placeholder: v3.8
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows 版本
      placeholder: Windows 11 25H2 (build 26200)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开…
        2. 点击…
        3. 出现…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 截图 / 录屏 / 补充说明
