name: 功能建议
description: 想要一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: 你希望有什么功能
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 为什么需要它 / 解决什么问题
  - type: textarea
    id: how
    attributes:
      label: 你设想的样子（可选）
